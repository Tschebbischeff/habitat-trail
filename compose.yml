name: ${APP_NAME_HOST}

networks:
  internal:
    name: ${APP_NAME_HOST}_internal
    driver: bridge
    ipam:
      config:
        - subnet: "${APP_NETWORK_POOL}"

volumes:
  habitat-config:
  floppy-db:
  # floppy-config:

secrets:
  REDIS_PASSWORD:
    file: ${SECRETS_DIR}/REDIS_PASSWORD
  FLOPPY_DJANGO_SECRET:
    file: ${SECRETS_DIR}/FLOPPY_DJANGO_SECRET
  FLOPPY_OAUTH_CLIENT_ID:
    file: ${SECRETS_DIR}/FLOPPY_OAUTH_CLIENT_ID
  FLOPPY_OAUTH_CLIENT_SECRET:
    file: ${SECRETS_DIR}/FLOPPY_OAUTH_CLIENT_SECRET
  FLOPPY_OAUTH_CLIENT_SECRET_HASHED_PBKDF2:
    file: ${SECRETS_DIR}/FLOPPY_OAUTH_CLIENT_SECRET_HASHED_PBKDF2


services:

  habitat-config-trail:
    image: tschebbischeff/habitat-config:latest
    container_name: ${APP_NAME_HOST}_habitat-config-trail
    restart: no
    env_file:
      - ./.env
      - path: ${ENV_DIR}/.env
        required: false
      - path: ${ENV_DIR}/habitat-config.env
        required: false
    environment:
      MODULE_NAME: "trail"
    secrets:
      - FLOPPY_OAUTH_CLIENT_ID
      - FLOPPY_OAUTH_CLIENT_SECRET_HASHED_PBKDF2
    networks:
      internal:
    volumes:
      - habitat-config:/habitat-config/orchestration
      - ./habitat-config:/habitat-config/source:ro
      # - floppy-config:/habitat-config/target/floppy

  floppy:
    build:
      context: ./floppy
    container_name: ${APP_NAME_HOST}_floppy
    restart: unless-stopped
    expose:
      - '8000'
    env_file:
      - ./.env
      - path: ${ENV_DIR}/.env
        required: false
      - path: ${ENV_DIR}/floppy.env
        required: false
    environment:
      # REDIS_URL: "redis://${APP_NAME_HOST}_redis:6379"
      REDIS_HOST: "${APP_NAME_HOST}_redis"
      REDIS_PORT: "6379"
      REDIS_DB: "2"
      REDIS_USER: "default"
      REDIS_PASSWORD_FILE: '/run/secrets/REDIS_PASSWORD'
      # REDIS_PREFIX: "floppy:"
      URLS: "https://floppy.${APP_HOST}"
      SECRET_FILE: "/run/secrets/FLOPPY_DJANGO_SECRET"
      SOCIAL_PROVIDERS: "allauth.socialaccount.providers.openid_connect"
      SOCIALACCOUNT_PROVIDERS: "" # Set by entrypoint script from FLOPPY_OAUTH_*_FILE credentials
      FLOPPY_OAUTH_CLIENT_ID_FILE: "/run/secrets/FLOPPY_OAUTH_CLIENT_ID"
      FLOPPY_OAUTH_CLIENT_SECRET_FILE: "/run/secrets/FLOPPY_OAUTH_CLIENT_SECRET"
      ACCOUNT_LOGOUT_REDIRECT_URL: "https://authelia.${APP_HOST}/logout?rd=https%3A%2F%2Ffloppy.${APP_HOST}"
      SOCIALACCOUNT_ONLY: "True"
      REDIRECT_LOGIN_TO_SSO: "True"
      OIDC_ADMIN_GROUPS: "[\"admins\",\"floppy_admins\"]"
      ADMIN_ENABLED: "True"
      TMDB_NSFW: "${FLOPPY_NSFW}"
      MAL_NSFW: "${FLOPPY_NSFW}"
      MU_NSFW: "${FLOPPY_NSFW}"
      IGDB_NSFW: "${FLOPPY_NSFW}"
    secrets:
      - REDIS_PASSWORD
      - FLOPPY_DJANGO_SECRET
      - FLOPPY_OAUTH_CLIENT_ID
      - FLOPPY_OAUTH_CLIENT_SECRET
    volumes:
      - floppy-db:/floppy/db
      - ${VOLUME_DIR}/floppy-backups:/floppy/backups
      # - floppy-config:/DEST/PATH
    networks:
      internal:
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider -q http://127.0.0.1:8000/health/ || exit 1" ]
      interval: 45s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      habitat-config-trail:
        condition: service_completed_successfully
